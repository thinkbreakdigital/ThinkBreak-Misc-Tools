<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="theme-color" content="#FAFAF7" id="theme-color-meta">
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --surface2: #f3f2ee;
      --border: #e4e2dc;
      --border-hover: #cccac2;
      --text: #1a1a18;
      --text-mid: #5c5b56;
      --text-dim: #9c9a94;
      --accent: #2d2e5a;
      --accent-dim: #e8f0eb;
      --radius: 0px;
      --shadow-soft: 0 10px 30px rgba(26, 26, 24, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body.dark {
      --text: #c4c4c4;
      --text-mid: #969696;
      --text-dim: #7b7b7b;
      --surface: #252522;
      --surface2: #1c1c1a;
      --border: #2e2e2b;
      --border-hover: #3d3d39;
      --accent: #4d4e94;
      background: #111110;
      color: var(--text);
    }

    body.dark #theme-btn {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text);
    }

    body.dark #theme-btn:hover,
    body.dark #theme-btn:focus-visible {
      border-color: #3d3d39;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 20px 80px;
      animation: fadeUp 0.4s ease-out both;
    }

    #theme-btn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 999;
      width: 44px;
      height: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      box-shadow: var(--shadow-soft);
    }

    #theme-btn:hover,
    #theme-btn:focus-visible {
      border-color: var(--border-hover);
      outline: none;
    }

    .tool-header {
      margin-bottom: 36px;
      padding-right: 56px;
    }

    .brand-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .tool-title {
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .tool-sub {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
      max-width: 58ch;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-dim);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.7;
      tab-size: 2;
    }

    .tool-shell {
      display: grid;
      gap: 20px;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 44px 16px 64px;
      }

      .tool-header {
        padding-right: 0;
      }
    }
  </style>
</head>
<body>
  <button id="theme-btn" type="button" aria-label="Toggle theme">
    <svg
      id="theme-icon-sun"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="display: none;"
    >
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg
      id="theme-icon-moon"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="wrap">
    <header class="tool-header">
      <div class="brand-label">ThinkBreak</div>
      <h1 class="tool-title">{{TITLE}}</h1>
      <p class="tool-sub">{{DESCRIPTION}}</p>
    </header>

    <section class="tool-shell" aria-label="Tool layout">
      <!-- Build the tool-specific UI inside this shell. -->
    </section>
  </main>

  <script>
    const THEME_DARK = "#111110";
    const THEME_LIGHT = "#FAFAF7";
    let elements;

    // Read the current system preference so the page starts in the expected mode.
    function getPreferredTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    // Apply the chosen light or dark mode and update icons and theme color.
    function applyTheme(theme) {
      const isDark = theme === "dark";

      elements.body.classList.toggle("dark", isDark);
      elements.sunIcon.style.display = isDark ? "block" : "none";
      elements.moonIcon.style.display = isDark ? "none" : "block";
      elements.themeButton.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );
      elements.themeColorMeta.setAttribute(
        "content",
        isDark ? THEME_DARK : THEME_LIGHT
      );
    }

    // Swap between light and dark mode for the current session.
    function toggleTheme() {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(nextTheme);
    }

    // Set the initial theme and attach the shared theme button listener.
    function initializeTheme() {
      applyTheme(getPreferredTheme());
      elements.themeButton.addEventListener("click", toggleTheme);
    }

    // Cache tool-specific DOM elements here when starting a new utility.
    function getElements() {
      return {
        body: document.body,
        themeButton: document.getElementById("theme-btn"),
        themeColorMeta: document.getElementById("theme-color-meta"),
        sunIcon: document.getElementById("theme-icon-sun"),
        moonIcon: document.getElementById("theme-icon-moon")
      };
    }

    // Read the current tool state here and return a normalized options object.
    function getOptions() {}

    // Attach tool-specific listeners here so the UI updates immediately.
    function bindEvents() {}

    // Run the tool's main input-to-output workflow here.
    function updateOutput() {}

    // Initialize the shared theme system and then the tool-specific logic.
    function init() {
      elements = getElements();
      initializeTheme();
      bindEvents();
      updateOutput();
    }

    init();
  </script>
</body>
</html>
