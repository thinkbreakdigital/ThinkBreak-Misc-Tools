<!--
Copy/paste light-dark mode component

How to use:
1. Paste the <meta> tag into <head>.
2. Paste the <style> block into your page styles.
3. Paste the <button> near the top of <body>.
4. Paste the <script> near the end of <body>.

This component:
- defaults to the user's system preference
- lets the user toggle the theme for the current session
- updates the visible icon and browser theme color
- does not store data in localStorage
-->

<meta name="theme-color" content="#FAFAF7" id="theme-color-meta">

<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --border: #e4e2dc;
    --border-hover: #cccac2;
    --text: #1a1a18;
  }

  body {
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s ease, color 0.2s ease;
  }

  body.dark {
    background: #111110;
    color: #f0efe8;
  }

  #theme-btn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    z-index: 999;
    width: 44px;
    height: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }

  #theme-btn:hover,
  #theme-btn:focus-visible {
    border-color: var(--border-hover);
    outline: none;
  }

  body.dark #theme-btn {
    background: #1c1c1a;
    border-color: #2e2e2b;
    color: #f0efe8;
  }

  body.dark #theme-btn:hover,
  body.dark #theme-btn:focus-visible {
    border-color: #3d3d39;
  }
</style>

<button id="theme-btn" type="button" aria-label="Toggle theme">
  <svg
    id="theme-icon-sun"
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    style="display: none;"
  >
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <svg
    id="theme-icon-moon"
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>

<script>
  const THEME_DARK = "#111110";
  const THEME_LIGHT = "#FAFAF7";

  function getThemeElements() {
    return {
      body: document.body,
      button: document.getElementById("theme-btn"),
      themeColorMeta: document.getElementById("theme-color-meta"),
      sunIcon: document.getElementById("theme-icon-sun"),
      moonIcon: document.getElementById("theme-icon-moon")
    };
  }

  function getPreferredTheme() {
    return window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
  }

  function applyTheme(theme) {
    const elements = getThemeElements();
    const isDark = theme === "dark";

    elements.body.classList.toggle("dark", isDark);
    elements.sunIcon.style.display = isDark ? "block" : "none";
    elements.moonIcon.style.display = isDark ? "none" : "block";
    elements.button.setAttribute(
      "aria-label",
      isDark ? "Switch to light mode" : "Switch to dark mode"
    );
    elements.themeColorMeta.setAttribute(
      "content",
      isDark ? THEME_DARK : THEME_LIGHT
    );
  }

  function toggleTheme() {
    const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
    applyTheme(nextTheme);
  }

  function initializeThemeToggle() {
    const elements = getThemeElements();

    applyTheme(getPreferredTheme());
    elements.button.addEventListener("click", toggleTheme);
  }

  initializeThemeToggle();
</script>
