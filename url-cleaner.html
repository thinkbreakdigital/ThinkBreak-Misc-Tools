<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>URL Cleaner</title>
  <meta name="theme-color" content="#FAFAF7" id="theme-color-meta">
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --surface2: #f3f2ee;
      --border: #e4e2dc;
      --border-hover: #cccac2;
      --text: #1a1a18;
      --text-mid: #5c5b56;
      --text-dim: #9c9a94;
      --accent: #2d2e5a;
      --accent-dim: #e8f0eb;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-soft: 0 10px 30px rgba(26, 26, 24, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body.dark {
      --text: #969696;
      --text-mid: #969696;
      --text-dim: #7b7b7b;
      background: #111110;
      color: var(--text);
    }

    body.dark .wrap {
      color: var(--text);
    }

    body.dark .brand-label {
      color: var(--text-dim);
    }

    body.dark .tool-title {
      color: var(--text);
    }

    body.dark input,
    body.dark select,
    body.dark textarea {
      background: #252522;
      border-color: #2e2e2b;
      color: var(--text);
    }

    body.dark input::placeholder,
    body.dark textarea::placeholder {
      color: var(--text-dim);
    }

    body.dark input:focus,
    body.dark select:focus,
    body.dark textarea:focus {
      border-color: #4d4e94;
    }

    body.dark #theme-btn {
      background: #1c1c1a;
      border-color: #2e2e2b;
      color: var(--text);
    }

    body.dark #theme-btn:hover,
    body.dark #theme-btn:focus-visible {
      border-color: #3d3d39;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 20px 80px;
      animation: fadeUp 0.4s ease-out both;
    }

    #theme-btn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 999;
      width: 44px;
      height: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      box-shadow: var(--shadow-soft);
    }

    #theme-btn:hover,
    #theme-btn:focus-visible {
      border-color: var(--border-hover);
      outline: none;
    }

    .tool-header {
      margin-bottom: 36px;
      padding-right: 56px;
    }

    .brand-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .brand-label {
      margin-bottom: 8px;
    }

    .tool-title {
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .tool-sub {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
      max-width: 58ch;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-dim);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.7;
      tab-size: 2;
    }

    .tool-shell {
      display: grid;
      gap: 20px;
    }

    .field-stack {
      display: grid;
      gap: 12px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .output-card {
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      box-shadow: var(--shadow-soft);
    }

    .copy-button {
      min-height: 44px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        color 0.15s ease,
        transform 0.08s ease,
        box-shadow 0.15s ease;
      box-shadow: var(--shadow-soft);
    }

    .copy-button:hover,
    .copy-button:focus-visible {
      background: #f3f2ee;
      border-color: var(--border-hover);
      outline: none;
    }

    .copy-button:active {
      background: #ffffff;
      border-color: #b8b5ab;
      transform: scale(0.985);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    }

    .copy-button:disabled {
      cursor: not-allowed;
      background: #eceae4;
      color: #9c9a94;
      border-color: #dad7cf;
      opacity: 1;
      transform: none;
      box-shadow: none;
    }

    body.dark .output-card,
    body.dark .copy-button {
      background: #252522;
      border-color: #2e2e2b;
      color: var(--text);
    }

    body.dark .copy-button:hover,
    body.dark .copy-button:focus-visible {
      background: #30302c;
      border-color: #4a4a45;
      outline: none;
    }

    body.dark .copy-button:active {
      background: #1a1a18;
      border-color: #232320;
      transform: scale(0.985);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    }

    body.dark .copy-button:disabled {
      background: #1c1c1a;
      color: #5f5f5a;
      border-color: #2a2a27;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 44px 16px 64px;
      }

      .tool-header {
        padding-right: 0;
      }
    }
  </style>
</head>
<body>
  <button id="theme-btn" type="button" aria-label="Toggle theme">
    <svg
      id="theme-icon-sun"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="display: none;"
    >
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg
      id="theme-icon-moon"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="wrap">
    <header class="tool-header">
      <div class="brand-label">ThinkBreak</div>
      <h1 class="tool-title">URL Cleaner</h1>
      <p class="tool-sub">Enter a URL with trackers and IDs to clean it.</p>
    </header>

    <section class="tool-shell" aria-label="Tool layout">
      <div class="field-stack">
        <label class="field-label" for="input-url">Input URL</label>
        <textarea
          id="input-url"
          placeholder="Paste a URL or bare domain here..."
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
        ></textarea>
      </div>

      <div class="field-stack">
        <div class="field-label">Cleaned URL</div>
        <div class="output-card" id="output-url" aria-live="polite"></div>
      </div>

      <button class="copy-button" id="copy-url" type="button" disabled>Copy URL</button>
    </section>
  </main>

  <script>
    const THEME_DARK = "#111110";
    const THEME_LIGHT = "#FAFAF7";

    // Return the shared theme elements so the theme toggle can update the page.
    function getThemeElements() {
      return {
        body: document.body,
        button: document.getElementById("theme-btn"),
        themeColorMeta: document.getElementById("theme-color-meta"),
        sunIcon: document.getElementById("theme-icon-sun"),
        moonIcon: document.getElementById("theme-icon-moon")
      };
    }

    // Read the current system preference so the page starts in the expected mode.
    function getPreferredTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    // Apply the chosen light or dark mode and update icons and theme color.
    function applyTheme(theme) {
      const elements = getThemeElements();
      const isDark = theme === "dark";

      elements.body.classList.toggle("dark", isDark);
      elements.sunIcon.style.display = isDark ? "block" : "none";
      elements.moonIcon.style.display = isDark ? "none" : "block";
      elements.button.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );
      elements.themeColorMeta.setAttribute(
        "content",
        isDark ? THEME_DARK : THEME_LIGHT
      );
    }

    // Swap between light and dark mode for the current session.
    function toggleTheme() {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(nextTheme);
    }

    // Set the initial theme and attach the shared theme button listener.
    function initializeTheme() {
      const elements = getThemeElements();

      applyTheme(getPreferredTheme());
      elements.button.addEventListener("click", toggleTheme);
    }

    // Cache the URL cleaner elements so the page can read the current input,
    // update the cleaned output, and copy the result without repeated lookups.
    function getElements() {
      return {
        body: document.body,
        themeButton: document.getElementById("theme-btn"),
        themeColorMeta: document.getElementById("theme-color-meta"),
        sunIcon: document.getElementById("theme-icon-sun"),
        moonIcon: document.getElementById("theme-icon-moon"),
        inputUrl: document.getElementById("input-url"),
        outputUrl: document.getElementById("output-url"),
        copyButton: document.getElementById("copy-url")
      };
    }

    // Return the raw user input in a small predictable object so the cleaner
    // logic stays separate from the DOM structure.
    function getInputState() {
      const elements = getElements();

      return {
        rawUrl: elements.inputUrl.value
      };
    }

    // Attach the shared theme button plus the URL cleaner input and copy
    // events so the page responds immediately as the user types.
    function bindEvents() {
      const elements = getElements();

      elements.inputUrl.addEventListener("input", updateOutput);
      elements.copyButton.addEventListener("click", copyCleanedUrl);
    }

    // Run the URL cleaning flow and render either the cleaned result or a
    // simple plain-language message when the input is empty or invalid.
    function updateOutput() {
      const elements = getElements();
      const state = getInputState();
      const result = cleanUrl(state.rawUrl);

      elements.outputUrl.textContent = result.output;
      elements.copyButton.disabled = !result.canCopy;
    }

    // Normalize a pasted value into a safer cleaned URL by trimming whitespace,
    // accepting bare domains, and removing common tracking parameters.
    function cleanUrl(input) {
      const rawValue = input.trim();

      if (!rawValue) {
        return {
          output: "",
          canCopy: false
        };
      }

      const candidate = normalizeUrlCandidate(rawValue);

      if (!candidate) {
        return {
          output: "Enter a valid URL.",
          canCopy: false
        };
      }

      try {
        const parsedUrl = new URL(candidate);
        const cleanedUrl = finalizeUrl(parsedUrl);

        return {
          output: cleanedUrl,
          canCopy: true
        };
      }
      catch {
        return {
          output: "Enter a valid URL.",
          canCopy: false
        };
      }
    }

    // Trim wrapping spaces and add https:// to bare domains so normal URLs and
    // pasted hostnames can use the same parsing flow.
    function normalizeUrlCandidate(value) {
      const trimmed = value.trim();

      if (!trimmed) {
        return "";
      }

      if (/^[a-z][a-z\d+\-.]*:\/\//i.test(trimmed)) {
        return trimmed;
      }

      if (/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?([/?#].*)?$/i.test(trimmed)) {
        return "https://" + trimmed;
      }

      return trimmed;
    }

    // Remove common tracking parameters, lowercase the hostname, and return a
    // clean URL string without a fragment or unnecessary trailing slash.
    function finalizeUrl(url) {
      const trackingParamPattern = /^(utm_[\w-]+|fbclid|gclid|dclid|gbraid|wbraid|mc_cid|mc_eid|igshid|mkt_tok|ref_src)$/i;
      const removableParams = [];

      url.hostname = url.hostname.toLowerCase();
      url.hash = "";

      url.searchParams.forEach((value, key) => {
        if (trackingParamPattern.test(key)) {
          removableParams.push(key);
        }
      });

      removableParams.forEach((key) => {
        url.searchParams.delete(key);
      });

      if (!url.search) {
        url.search = "";
      }

      if (url.pathname.length > 1) {
        url.pathname = url.pathname.replace(/\/+$/, "");
      }

      return url.toString();
    }

    // Copy the current cleaned URL when there is a valid result available.
    async function copyCleanedUrl() {
      const elements = getElements();
      const value = elements.outputUrl.textContent;

      if (!value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
      }
      catch {
        elements.outputUrl.textContent = "Unable to copy URL in this browser.";
        elements.copyButton.disabled = true;
      }
    }

    // Initialize the shared theme system and then the tool-specific logic.
    function init() {
      initializeTheme();
      bindEvents();
      updateOutput();
    }

    init();
  </script>
</body>
</html>
